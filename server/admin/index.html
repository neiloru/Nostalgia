<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nostalgia Admin</title>
  <link rel="stylesheet" href="admin.css" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
</head>
<body>
  <div id="login" class="login hidden">
    <form id="loginForm" class="card login-card">
      <div class="brand big"><span class="logo">N</span> Nostalgia</div>
      <p class="muted">Server administration</p>
      <label>Username <input name="username" autocomplete="username" required /></label>
      <label>Password <input name="password" type="password" autocomplete="current-password" required /></label>
      <button class="primary" type="submit">Sign in</button>
      <p class="error" id="loginError"></p>
    </form>
  </div>

  <div id="app" class="hidden">
    <aside class="sidebar">
      <div class="brand"><span class="logo">N</span> Nostalgia</div>
      <nav id="nav">
        <a href="#dashboard" data-page="dashboard">Dashboard</a>
        <a href="#games" data-page="games">Games</a>
        <a href="#import" data-page="import">Import <span class="badge" id="unsortedBadge"></span></a>
        <a href="#emulators" data-page="emulators">Emulators</a>
        <a href="#users" data-page="users">Users</a>
      </nav>
      <div class="sidebar-foot">
        <div id="jobIndicator" class="job-indicator"></div>
        <button id="logout" class="ghost">Sign out</button>
      </div>
    </aside>
    <main id="main"></main>
  </div>

  <div id="modal" class="modal hidden"><div class="modal-box" id="modalBox"></div></div>
  <div id="toasts" class="toasts"></div>
  <script src="admin.js"></script>
</body>
</html>
