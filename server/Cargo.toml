[package]
name = "nostalgia-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Nostalgia server: game library, downloads, users, versioned cloud saves and admin web UI"

[lib]
path = "src/lib.rs"

[[bin]]
name = "nostalgia-server"
path = "src/main.rs"

[dependencies]
nostalgia-shared.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
regex.workspace = true
sha2.workspace = true
hex.workspace = true
uuid.workspace = true
anyhow.workspace = true
tokio.workspace = true
reqwest.workspace = true
futures-util.workspace = true
axum = "0.8"
tower-http = { version = "0.6", features = ["fs"] }
tower = "0.5"
rusqlite = { version = "0.37", features = ["bundled"] }
scrypt = { version = "0.11", default-features = false }
base64 = "0.22"
rand = "0.9"
md-5 = "0.10"
sha1 = "0.10"
crc32fast = "1"
percent-encoding = "2"
http-body-util = "0.1"
# Scaled-down game media for the clients (src/thumbs.rs).
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }

[dev-dependencies]
tempfile = "3"
