# Nostalgia server with Docker Compose.
#   1. Copy this file to an empty folder as docker-compose.yml and adjust the library path.
#   2. docker compose up -d
#   3. Edit ./config/settings.yaml (created on first start; at least adminPassword),
#      then: docker compose restart
#   Admin UI: http://<host>:8080/admin   Clients connect to http://<host>:8080
services:
  nostalgia:
    image: ghcr.io/neiloru/nostalgia-server:latest
    # Or build from a clone of the repository instead of pulling (run from the server/ folder):
    # build:
    #   context: ..
    #   dockerfile: server/Dockerfile
    container_name: nostalgia
    ports:
      - "8080:8080"
    # Optional: timezone for log timestamps, IGDB credentials instead of in settings.yaml
    # environment:
    #   TZ: Europe/Berlin
    #   IGDB_CLIENT_ID: "..."
    #   IGDB_CLIENT_SECRET: "..."
    volumes:
      - ./config:/config            # settings.yaml
      - /path/to/library:/library   # games/{platform}/... and emulators/{platform}/...
      - ./database:/database        # SQLite database (keep it on a local disk, back it up!)
      - ./saves:/saves              # versioned cloud saves (back them up!)
      - ./metadata:/metadata        # IGDB metadata and artwork (can be downloaded again)
    # Files the server creates (platform folders in the library, database, saves, metadata) belong to
    # this user. Uncomment and set your own UID:GID to avoid root-owned files; create ./config,
    # ./database, ./saves and ./metadata first (mkdir config database saves metadata) so that this
    # user can write to them.
    # user: "1000:1000"
    restart: unless-stopped
