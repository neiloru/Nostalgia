name: Server build

# Runs on every push to main as part of "Build and pre-release" (prerelease.yml), which calls
# this workflow and publishes the files. Can also be started by hand: Actions → "Server build".
# Each package is self-contained: the server binary (admin UI embedded), a start script,
# settings.example.yaml, LICENSE and a README.txt.
on:
  workflow_call:
    inputs:
      platform:
        type: string
        default: all
      skip-tests:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      platform:
        description: Platforms to build
        type: choice
        options: [all, windows, linux, macos]
        default: all
      skip-tests:
        description: Skip the tests
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Tests (shared + server)
    if: ${{ !inputs.skip-tests }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: server-test
      - run: cargo test --locked -p nostalgia-shared -p nostalgia-server

  windows:
    name: Windows x64 (zip)
    needs: test
    # Runs after the tests, or right away when they were skipped.
    if: ${{ !failure() && !cancelled() && (inputs.platform == 'all' || inputs.platform == 'windows') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: server
      - run: scripts/package.sh server
        shell: bash
      - uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          # Already a zip: upload as-is instead of zipping it again.
          archive: false
          path: release/*.zip

  linux:
    name: SteamOS / Linux x64 (tar.gz)
    needs: test
    if: ${{ !failure() && !cancelled() && (inputs.platform == 'all' || inputs.platform == 'linux') }}
    # The oldest supported runner: the binary then runs on older glibc versions as well.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: server
      - run: scripts/package.sh server
      - name: Smoke test the package
        run: |
          set -e
          mkdir -p /tmp/smoke && tar -xzf release/nostalgia-server-*.tar.gz -C /tmp/smoke
          cd /tmp/smoke/nostalgia-server-*
          printf 'adminUsername: admin\nadminPassword: ci-test\nlibraryDirectory: ./library\nport: 8799\n' > settings.yaml
          ./start.sh > server.log 2>&1 &
          pid=$!
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8799/api/health && break; sleep 1; done
          echo
          curl -fs -o /dev/null http://127.0.0.1:8799/admin/ || { cat server.log; exit 1; }
          test -d library/games/psx
          ./nostalgia-server --version
          kill "$pid"
      - uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          # Unzipped upload keeps the tar.gz (and the file permissions inside) as-is.
          archive: false
          path: release/*.tar.gz

  macos:
    name: macOS arm64 (tar.gz)
    needs: test
    if: ${{ !failure() && !cancelled() && (inputs.platform == 'all' || inputs.platform == 'macos') }}
    runs-on: macos-latest # Apple Silicon
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: server
      - run: scripts/package.sh server
      - name: Smoke test the package
        run: |
          set -e
          mkdir -p /tmp/smoke && tar -xzf release/nostalgia-server-*.tar.gz -C /tmp/smoke
          cd /tmp/smoke/nostalgia-server-*
          printf 'adminUsername: admin\nadminPassword: ci-test\nlibraryDirectory: ./library\nport: 8799\n' > settings.yaml
          ./start.sh > server.log 2>&1 &
          pid=$!
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8799/api/health && break; sleep 1; done
          echo
          curl -fs -o /dev/null http://127.0.0.1:8799/admin/ || { cat server.log; exit 1; }
          kill "$pid"
      - uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          archive: false
          path: release/*.tar.gz
