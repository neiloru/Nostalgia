name: Client build

# Runs on every push to main as part of "Build and pre-release" (prerelease.yml), which calls
# this workflow and publishes the files. Can also be started by hand: Actions → "Client build".
on:
  workflow_call:
    inputs:
      platform:
        type: string
        default: all
      skip-tests:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      platform:
        description: Platforms to build
        type: choice
        options: [all, windows, linux]
        default: all
      skip-tests:
        description: Skip typecheck and tests
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    name: Typecheck and tests
    if: ${{ !inputs.skip-tests }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  windows:
    name: Windows (installer + portable)
    needs: test
    # Runs after the tests, or right away when they were skipped.
    if: ${{ !failure() && !cancelled() && (inputs.platform == 'all' || inputs.platform == 'windows') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run dist:win -w client
      # Uploaded unzipped (archive: false): each file is its own downloadable artifact.
      - uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          archive: false
          path: client/release/*-setup.exe
      - uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          archive: false
          path: client/release/*-portable.exe

  linux:
    name: SteamOS / Linux (AppImage + tar.gz)
    needs: test
    if: ${{ !failure() && !cancelled() && (inputs.platform == 'all' || inputs.platform == 'linux') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run dist:linux -w client
      # Unzipped uploads keep the executable bit of the AppImage.
      - uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          archive: false
          path: client/release/*.AppImage
      - uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          archive: false
          path: client/release/*.tar.gz
