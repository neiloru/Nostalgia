[package]
name = "nostalgia"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
dirs = "7.0.0"
fs4 = "1.1.0"
futures-channel = "0.3.34"
futures-util.workspace = true
gethostname = "1.1.0"
gilrs = "0.11.2"
gpui-kit = "0.9"
hex.workspace = true
# Decoding catalog media for the in-memory cache (src/media_cache.rs).
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
nostalgia-shared.workspace = true
percent-encoding = "2.3.2"
regex.workspace = true
reqwest = { workspace = true, default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { workspace = true, features = ["derive", "rc"] }
serde_json = { workspace = true, features = ["preserve_order"] }
sha2.workspace = true
tokio = { workspace = true, features = ["full"] }
uuid = { workspace = true, features = ["v4"] }
zip = { version = "9.4.2", default-features = false, features = ["deflate"] }

[build-dependencies]
# Windows: the app icon and version info in nostalgia.exe (build.rs).
embed-resource = "3.0.12"

# macOS: compile the Metal shaders when the app starts instead of with `xcrun metal` at build time
# (newer Xcode versions ship without the Metal compiler unless it is downloaded separately).
[target.'cfg(target_os = "macos")'.dependencies]
gpui-pre-macos = { version = "0.3.11", features = ["runtime_shaders"] }
# Dock icon when started outside Nostalgia.app (src/app_icon.rs).
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSImage", "NSResponder"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSData"] }

# Linux: the X11 window icon (src/app_icon.rs).
[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
image = { version = "0.25.10", default-features = false, features = ["png"] }
