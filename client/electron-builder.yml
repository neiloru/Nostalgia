appId: app.nostalgia.client
productName: Nostalgia
executableName: Nostalgia
directories:
  output: release
  buildResources: build
files:
  - out/**
  - resources/**
  - package.json
icon: build/icon.png
asar: true
win:
  icon: build/icon.ico
  target:
    - target: nsis
    - target: portable
nsis:
  artifactName: Nostalgia-${version}-${arch}-setup.${ext}
  oneClick: false
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  allowToChangeInstallationDirectory: true
portable:
  artifactName: Nostalgia-${version}-${arch}-portable.${ext}
linux:
  executableName: nostalgia
  icon: build/icons
  desktop:
    entry:
      StartupWMClass: nostalgia
  # AppImage runs on SteamOS without touching the read-only system partition.
  target:
    - AppImage
    - tar.gz
  category: Game
  artifactName: Nostalgia-${version}-${arch}.${ext}
